        img[alt="image"]{

            width: 250px;
            border-radius: 50px;
            border-color: rgb(201, 22, 22);

        h1[id$='tag']{
            color: brown;

        }
        h1[id *='heading']{

        }

    <h1 id="heading-tag">headings</h1>
